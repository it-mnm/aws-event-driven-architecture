# .github/workflows/terraform-ci-cd.yml
name: "Terraform CI/CD Pipeline"

# main 브랜치에 push 또는 Pull Request가 발생할 때 자동 실행
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: "Terraform Action"
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소의 코드를 가상 환경으로 체크아웃
      - name: Checkout Source Code
        uses: actions/checkout@v3

      # 2. 테라폼 실행을 위한 CLI 환경 가동
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      # 3. AWS 인증 정보 설정 (GitHub Secrets 변수 참조)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # 4. 테라폼 초기화 및 모듈 동기화
      - name: Terraform Init
        run: terraform init

      # 5. 테라폼 코드 문법 및 포맷 검사
      - name: Terraform Validate
        run: terraform validate

      # 6. 배포 계획 수립 및 변경 사항 확인
      - name: Terraform Plan
        run: terraform plan

      # 7. main 브랜치에 push된 경우에만 최종 실물 인프라 자동 배포 실행
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve